<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="288" viewBox="0 0 1000 288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace"><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern><linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".85" stop-color="#00ff9c" stop-opacity=".9"/><stop offset="1" stop-color="#d8fff0"/></linearGradient></defs><style>.ln{opacity:0;animation:ln .6s steps(4) forwards}@keyframes ln{to{opacity:1}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1000" height="288" rx="8" fill="#030806"/><rect x=".75" y=".75" width="998.5" height="286.5" rx="8" fill="none" stroke="#00ff9c" stroke-opacity=".45" stroke-width="1.5"/><path d="M0 8a8 8 0 0 1 8-8h984a8 8 0 0 1 8 8v20H0z" fill="#07130e"/><circle cx="16" cy="14" r="4" fill="#ff2e63"/><circle cx="30" cy="14" r="4" fill="#ffb86b"/><circle cx="44" cy="14" r="4" fill="#00ff9c"/><text x="62" y="18" font-size="11.5" fill="#5f8f7a">~/stack.md</text><text x="26" y="62" font-size="15"><tspan fill="#00ff9c">$ </tspan><tspan fill="#c9f7e4">cat stack.md</tspan></text><text class="ln" style="animation-delay:0.40s" x="26" y="100" font-size="15" xml:space="preserve"><tspan fill="#00ff9c" font-weight="700">* languages:</tspan> <tspan fill="#c9f7e4">JavaScript, TypeScript, Python, Java, C, C++, SQL</tspan></text><text class="ln" style="animation-delay:0.75s" x="26" y="134" font-size="15" xml:space="preserve"><tspan fill="#08f7fe" font-weight="700">* frontend:</tspan> <tspan fill="#c9f7e4">HTML5, CSS3, Tailwind CSS, React, Vite, Chrome Extensions (MV3)</tspan></text><text class="ln" style="animation-delay:1.10s" x="26" y="168" font-size="15" xml:space="preserve"><tspan fill="#ff79c6" font-weight="700">* backend:</tspan> <tspan fill="#c9f7e4">Node.js, REST APIs</tspan></text><text class="ln" style="animation-delay:1.45s" x="26" y="202" font-size="15" xml:space="preserve"><tspan fill="#b388ff" font-weight="700">* data &amp; ml:</tspan> <tspan fill="#c9f7e4">pandas, NumPy, scikit-learn, RDKit</tspan></text><text class="ln" style="animation-delay:1.80s" x="26" y="236" font-size="15" xml:space="preserve"><tspan fill="#ffb86b" font-weight="700">* tools &amp; automation:</tspan> <tspan fill="#c9f7e4">Git, GitHub, Docker, Vercel, GCP, Linux, UTM, n8n, Playwright</tspan></text><text x="26" y="276" font-size="15" fill="#00ff9c">$ <tspan class="bl">█</tspan></text><rect width="1000" height="288" rx="8" fill="url(#scan)"/></svg>