<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" shape-rendering="crispEdges" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace"><defs></defs><style>
.bob{animation:bob 1.2s steps(2) infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
